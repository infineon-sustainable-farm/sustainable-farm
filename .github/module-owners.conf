# Module ownership, read by scripts/module-ownership-guard.sh.
#
# Only the owner of a module may change files of that module, from the
# feature/<module>/init branch assigned to them. Admins may change anything.
# Any change outside a module folder (new root folder, docs, scripts, CI,
# shared code, build files) is reserved to admins.
#
# Format: one entry per line.
#   admin  <github-login>
#   <module-folder>  <github-login>
# Changing this file is itself reserved to admins.

admin  PANK4SS

# Repository layout, checked on EVERY PR (admins included).
#   root  <name>  : an entry allowed at the root of the repository
#   doc   <name>  : a file allowed in docs/ (general project documentation only;
#                   module documentation lives inside the module folders).
#                   <name> is the path under docs/, for example adr/README.md
#                   for the architecture decision records.
root  .env.example
root  .github
root  .gitignore
root  .vscode
root  README.md
root  backend
root  docker-compose.yml
root  docs
root  frontend
root  scripts

doc   README.md
doc   ARCHITECTURE.md
doc   CI-AUTO-REVIEW.md
doc   CONTRIBUTING.md
doc   SETUP.md
doc   adr/README.md
doc   adr/0001-app-shell-et-design-system.md
doc   adr/0002-conventions-base-de-donnees-et-api.md
doc   adr/0003-communication-entre-modules.md
doc   adr/0004-referentiels-partages.md

