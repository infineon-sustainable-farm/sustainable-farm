# Module ownership, read by scripts/module-ownership-guard.sh.
#
# Only the owner of a module may change files of that module, from the
# feature/<module>/init branch assigned to them. Admins may change anything.
# Any change outside a module folder (new root folder, docs, scripts, CI,
# shared code, build files) is reserved to admins.
#
# Format: one entry per line.
#   admin  <github-login>
#   <module-folder>  <github-login>
# Changing this file is itself reserved to admins.

admin  PANK4SS

