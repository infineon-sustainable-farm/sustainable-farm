# Base CI: build + REAL tests (PostgreSQL, not H2) + Flyway migrations.
#
# Fixes findings _shared/02 and _shared/04:
#  - backend tests now run AGAINST PostgreSQL (environment variables override
#    the jdbc:h2 URL from application-test.properties, since Spring ranks OS
#    env above profile files); JPQL that H2 accepts but PostgreSQL rejects
#    (the root cause of the broken develop) now fails the PR;
#  - if the branch ships Flyway migrations (backend/src/main/resources/
#    db/migration), they are applied to a fresh PostgreSQL database by the
#    "migrations" job — migrations that never ran (PR-33/#41) no longer pass.
#
# Required checks for branch protection (see docs/CI-AUTO-REVIEW.md):
#   - "Backend tests (PostgreSQL)"
#   - "Flyway migrations (PostgreSQL)"
#   - "Frontend build"
#   - "Quality gate (auto-review)" (workflow auto-review.yml)
name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sustainable_farm_test
          POSTGRES_USER: farm_admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farm_admin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # Overrides the H2 config from src/test/resources: tests see real
    # PostgreSQL. If a test only passes on H2, that is a bug, not flakiness.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sustainable_farm_test
      SPRING_DATASOURCE_USERNAME: farm_admin
      SPRING_DATASOURCE_PASSWORD: changeme
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests against PostgreSQL
        working-directory: backend
        run: ./mvnw --batch-mode test

  migrations:
    name: Flyway migrations (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sustainable_farm
          POSTGRES_USER: farm_admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U farm_admin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Flyway migrations
        id: detect
        run: |
          if compgen -G "backend/src/main/resources/db/migration/*" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Fresh database -> every migration must apply cleanly.
      # Fails on: non-replayable SQL (PR-33 V2), a migration depending on a
      # missing rename, an entity referencing a column that was never created (#41).
      - name: Apply migrations on fresh PostgreSQL
        if: steps.detect.outputs.present == 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5433/sustainable_farm \
            -user=farm_admin -password=changeme -connectRetries=10 \
            migrate

      - name: Skipped (no migrations on this branch)
        if: steps.detect.outputs.present == 'false'
        run: echo "No db/migration folder on this branch - job skipped (success)."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
