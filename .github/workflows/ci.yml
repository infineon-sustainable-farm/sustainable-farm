# Base CI: build + REAL tests on PostgreSQL.
#
# Fixes findings _shared/02 and _shared/04:
#  - backend tests run AGAINST PostgreSQL (environment variables override the
#    jdbc:h2 URL from application-test.properties, since Spring ranks OS env
#    above profile files); JPQL that H2 accepts but PostgreSQL rejects now
#    fails the PR instead of breaking develop;
#  - the job is split into separate steps (connectivity, compile, tests) so a
#    red check points at the failing phase directly from the GitHub UI.
#
# Note: the project does not use Flyway yet. When migrations are introduced
# (backend/src/main/resources/db/migration), add a dedicated job that applies
# them to a fresh PostgreSQL instance.
#
# Required checks for branch protection (see docs/CI-AUTO-REVIEW.md):
#   - "Backend tests (PostgreSQL)"
#   - "Frontend build"
#   - "Quality gate (auto-review)" (workflow auto-review.yml)
name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sustainable_farm_test
          POSTGRES_USER: farm_admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farm_admin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # Overrides the H2 config from src/test/resources: tests see real
    # PostgreSQL. If a test only passes on H2, that is a bug, not flakiness.
    # NOTE: the dialect must stay auto-detected. Forcing
    # SPRING_JPA_DATABASE_PLATFORM=PostgreSQLDialect would also poison the
    # @DataJpaTest slices, which Spring Boot swaps to embedded H2: Hibernate
    # would then emit PostgreSQL-style CHECK constraints from Bean
    # Validation (@Min, @Positive) into H2, and every slice test would fail
    # with "Check constraint invalid". Auto-detection gives PostgreSQL to
    # real PostgreSQL contexts and H2Dialect (no emitted checks) to slices.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sustainable_farm_test
      SPRING_DATASOURCE_USERNAME: farm_admin
      SPRING_DATASOURCE_PASSWORD: changeme
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check PostgreSQL connectivity
        run: |
          for i in 1 2 3 4 5; do
            if timeout 3 bash -c '</dev/tcp/localhost/5432' 2>/dev/null; then
              echo "PostgreSQL is reachable on localhost:5432."
              exit 0
            fi
            echo "PostgreSQL not reachable yet (attempt $i/5), retrying in 3s..."
            sleep 3
          done
          echo "::error::Cannot connect to the PostgreSQL service on localhost:5432."
          exit 1

      # Separate step: if the build breaks, the GitHub UI shows this step red
      # and the test phase is not the suspect.
      - name: Compile backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test-compile

      - name: Run backend tests against PostgreSQL
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
