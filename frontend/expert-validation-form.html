<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT × Infineon Expert Validation</title>
    <style>
        :root {
            --color-green-primary: #1a7f37;
            --color-green-light: #e8f5e9;
            --color-gray-dark: #212529;
            --color-gray-medium: #495057;
            --color-gray-light: #f8f9fa;
            --color-gray-border: #dee2e6;
            --color-white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--color-gray-light);
            color: var(--color-gray-dark);
            line-height: 1.6;
        }

        .header {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-border);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header__brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header__program {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-gray-dark);
            letter-spacing: -0.3px;
        }

        .header__project {
            font-size: 14px;
            color: var(--color-gray-medium);
        }

        .header__badge {
            display: inline-block;
            background: var(--color-green-primary);
            color: var(--color-white);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .header__year {
            font-size: 14px;
            color: var(--color-gray-medium);
        }

        .intro-panel {
            background: var(--color-white);
            padding: 24px;
            border-bottom: 1px solid var(--color-gray-border);
        }

        .intro-panel__title {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--color-gray-dark);
        }

        .intro-panel__description {
            color: var(--color-gray-medium);
            margin: 0 0 16px 0;
            font-size: 14px;
        }

        .intro-panel__indicators {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .indicator {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .indicator__number {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-green-primary);
        }

        .indicator__label {
            font-size: 12px;
            color: var(--color-gray-medium);
        }

        .app-container {
            display: flex;
            min-height: calc(100vh - 180px);
        }

        .sidebar {
            width: 260px;
            background: var(--color-white);
            border-right: 1px solid var(--color-gray-border);
            padding: 24px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar__title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-gray-medium);
            margin: 0 0 16px 0;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            text-decoration: none;
            color: var(--color-gray-medium);
            font-size: 14px;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        .nav-link:hover {
            background: var(--color-gray-light);
            color: var(--color-gray-dark);
        }

        .nav-link--active {
            background: var(--color-green-light);
            color: var(--color-green-primary);
            font-weight: 500;
        }

        .nav-link--completed {
            color: var(--color-green-primary);
        }

        .nav-link--completed .nav-icon {
            color: var(--color-green-primary);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .nav-icon--completed {
            background: var(--color-green-primary);
            color: var(--color-white);
            border-radius: 50%;
        }

        .progress-bar {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--color-gray-border);
            font-size: 12px;
            color: var(--color-gray-medium);
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .section-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-green-primary);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            color: var(--color-gray-dark);
        }

        .section-help {
            color: var(--color-gray-medium);
            font-size: 14px;
            margin: 0 0 24px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--color-gray-dark);
        }

        .label-helper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .helper-text {
            font-size: 12px;
            color: var(--color-gray-medium);
        }

        .required-indicator {
            color: var(--color-green-primary);
            font-weight: 700;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--color-gray-border);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: var(--color-white);
            color: var(--color-gray-dark);
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--color-green-primary);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--color-gray-medium);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .char-counter {
            font-size: 11px;
            color: var(--color-gray-medium);
            margin-top: 4px;
        }

        .char-counter--warning {
            color: #ffc107;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn--primary {
            background: var(--color-green-primary);
            color: var(--color-white);
        }

        .btn--primary:hover {
            background: #155e32;
        }

        .btn--secondary {
            background: var(--color-gray-light);
            color: var(--color-gray-medium);
        }

        .btn--secondary:hover {
            background: var(--color-gray-border);
        }

        .btn--danger {
            background: #dc3545;
            color: var(--color-white);
        }

        .btn--danger:hover {
            background: #c82333;
        }

        .section-hidden {
            display: none;
        }

        .confirmation-panel {
            background: var(--color-green-light);
            border: 1px solid var(--color-green-primary);
            border-radius: 4px;
            padding: 16px 20px;
            margin-top: 24px;
        }

        .confirmation-panel__title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-green-primary);
            margin: 0 0 8px 0;
        }

        .confirmation-panel__text {
            color: var(--color-gray-medium);
            font-size: 14px;
            margin: 0;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--color-gray-border);
            }

            .main-content {
                padding: 20px;
            }

            .intro-panel__indicators {
                gap: 16px;
            }

            .progress-bar {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .intro-panel__indicators {
                justify-content: center;
            }

            .radio-group {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media print {
            body { background: white; }
            .header, .intro-panel, .sidebar, .actions, .nav-list, .progress-bar, .confirmation-panel { display: none !important; }
            .app-container { display: block; }
            .main-content { padding: 0; overflow: visible; }
            .form-section { display: block !important; page-break-after: always; padding: 20px 0; border-bottom: 1px solid #ddd; }
            .form-section:last-child { page-break-after: auto; }
            .section-header { border-bottom: 2px solid var(--color-green-primary); padding-bottom: 8px; }
            .form-group { page-break-inside: avoid; }
            input, textarea, select { border: 1px solid #ccc; background: #f8f9fa; }
        }
        .header__right { display: flex; align-items: center; gap: 16px; }
        .lang-toggle { display: flex; background: var(--color-gray-light); border: 1px solid var(--color-gray-border); border-radius: 4px; overflow: hidden; }
        .lang-btn { padding: 5px 12px; border: none; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--color-gray-medium); transition: background-color 0.2s, color 0.2s; }
        .lang-btn:hover { background: var(--color-gray-border); }
        .lang-btn--active { background: var(--color-green-primary) !important; color: var(--color-white) !important; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header__brand">
            <div class="header__program" data-i18n="header_program">BIT × Infineon Excellence Program</div>
            <div class="header__project" data-i18n="header_project">Sustainable Farm — Product Transformation</div>
            <span class="header__badge" data-i18n="header_badge">EXPERT VALIDATION</span>
        </div>
        <div class="header__right">
            <div class="lang-toggle" id="langToggle">
                <button type="button" class="lang-btn lang-btn--active" id="langEn" data-lang="en">EN</button>
                <button type="button" class="lang-btn" id="langFr" data-lang="fr">FR</button>
            </div>
            <span class="header__year" data-i18n="header_year">2026</span>
        </div>
    </header>

    <div class="intro-panel">
        <h2 class="intro-panel__title" data-i18n="intro_title"></h2>
        <p class="intro-panel__description" data-i18n="intro_description"></p>
        <div class="intro-panel__indicators">
            <div class="indicator">
                <span class="indicator__number" data-i18n="intro_duration_num"></span>
                <span class="indicator__label" data-i18n="intro_duration_label"></span>
            </div>
            <div class="indicator">
                <span class="indicator__number" data-i18n="intro_sections_num"></span>
                <span class="indicator__label" data-i18n="intro_sections_label"></span>
            </div>
            <div class="indicator">
                <span class="indicator__number" data-i18n="intro_json_num"></span>
                <span class="indicator__label" data-i18n="intro_json_label"></span>
            </div>
        </div>
    </div>

    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <span class="sidebar__title" data-i18n="nav_title"></span>
            <ul class="nav-list" id="navList">
                <li class="nav-item">
                    <a href="#" class="nav-link nav-link--active" data-section="1">
                        <span class="nav-icon nav-icon--filled" id="nav-icon-1"></span>
                        <span data-i18n="nav_1"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="2">
                        <span class="nav-icon" id="nav-icon-2"></span>
                        <span data-i18n="nav_2"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="3">
                        <span class="nav-icon" id="nav-icon-3"></span>
                        <span data-i18n="nav_3"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="4">
                        <span class="nav-icon" id="nav-icon-4"></span>
                        <span data-i18n="nav_4"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="5">
                        <span class="nav-icon" id="nav-icon-5"></span>
                        <span data-i18n="nav_5"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="6">
                        <span class="nav-icon" id="nav-icon-6"></span>
                        <span data-i18n="nav_6"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="7">
                        <span class="nav-icon" id="nav-icon-7"></span>
                        <span data-i18n="nav_7"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="8">
                        <span class="nav-icon" id="nav-icon-8"></span>
                        <span data-i18n="nav_8"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="9">
                        <span class="nav-icon" id="nav-icon-9"></span>
                        <span data-i18n="nav_9"></span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="10">
                        <span class="nav-icon" id="nav-icon-10"></span>
                        <span data-i18n="nav_10"></span>
                    </a>
                </li>
            </ul>
            <div class="progress-bar" id="progressBar"></div>
        </nav>

        <main class="main-content" id="mainContent">
            <form id="expertForm">

                <section class="form-section" data-section="1">
                    <div class="section-header">
                        <span class="section-number">01</span>
                        <h2 class="section-title" data-i18n="s1_title"></h2>
                    </div>
                    <p class="section-help" data-i18n="s1_help"></p>

                    <div class="form-group">
                        <label for="expert_name" data-i18n="s1_name_req"></label>
                        <input type="text" id="expert_name" name="expert_name" required>
                    </div>

                    <div class="form-group">
                        <label for="profession" data-i18n="s1_profession"></label>
                        <input type="text" id="profession" name="profession">
                    </div>

                    <div class="form-group">
                        <label for="experience_years" data-i18n="s1_experience"></label>
                        <input type="number" id="experience_years" name="experience_years" min="0" max="80">
                    </div>

                    <div class="form-group">
                        <label for="specialization" data-i18n="s1_specialization"></label>
                        <input type="text" id="specialization" name="specialization">
                    </div>

                    <div class="form-group">
                        <label for="activity" data-i18n="s1_activity"></label>
                        <textarea id="activity" name="activity" data-i18n-placeholder="s1_activity_ph"></textarea>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn btn--primary" data-next="2" data-i18n="s1_next"></button>
                    </div>
                </section>

                <section class="form-section section-hidden" data-section="2">
                    <div class="section-header">
                        <span class="section-number">02</span>
                        <h2 class="section-title" data-i18n="s2_title"></h2>
                    </div>
                    <p class="section-help" data-i18n="s2_help"></p>

                    <div class="form-group">
                        <label for="process_steps" data-i18n="s2_steps"></label>
                        <textarea id="process_steps" name="process_steps" data-i18n-placeholder="s2_steps_ph"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="intervention_stage" data-i18n="s2_intervention"></label>
                        <textarea id="intervention_stage" name="intervention_stage"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="critical_steps" data-i18n="s2_critical"></label>
                        <textarea id="critical_steps" name="critical_steps"></textarea>
                    </div>

                    <div class="form-group">
                        <label data-i18n="s2_confidence"></label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" name="process_confidence" value="low"> <span data-i18n="s2_conf_low"></span></label>
                            <label class="radio-item"><input type="radio" name="process_confidence" value="medium"> <span data-i18n="s2_conf_med"></span></label>
                            <label class="radio-item"><input type="radio" name="process_confidence" value="high"> <span data-i18n="s2_conf_high"></span></label>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn btn--secondary" data-prev="1" data-i18n="s2_prev"></button>
                        <button type="button" class="btn btn--primary" data-next="3" data-i18n="s2_next"></button>
                    </div>
                </section>

                <section class="form-section section-hidden" data-section="3">
                    <div class="section-header">
                        <span class="section-number">03</span>
                        <h2 class="section-title" data-i18n="s3_title"></h2>
                    </div>
                    <p class="section-help" data-i18n="s3_help"></p>

                    <div class="form-group">
                        <label data-i18n="s3_varieties"></label>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" name="varieties" value="Amelie"> Amelie</label>
                            <label class="checkbox-item"><input type="checkbox" name="varieties" value="Kent"> Kent</label>
                            <label class="checkbox-item"><input type="checkbox" name="varieties" value="Keitt"> Keitt</label>
                            <label class="checkbox-item"><input type="checkbox" name="varieties" value="Tommy Atkins"> Tommy Atkins</label>
                            <label class="checkbox-item"><input type="checkbox" name="varieties" value="Mangifera Indica"> Mangifera Indica</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="varieties_other" data-i18n="s3_varieties_other"></label>
                        <input type="text" id="varieties_other" name="varieties_other">
                    </div>

                    <div class="form-group">
                        <label for="maturity_level" data-i18n="s3_maturity_level"></label>
                        <select id="maturity_level" name="maturity_level">
                            <option value="" data-i18n-opt="s3_maturity_opt0"></option>
                            <option value="green" data-i18n-opt="s3_maturity_opt1"></option>
                            <option value="semi-ripe" data-i18n-opt="s3_maturity_opt2"></option>
                            <option value="ripe" data-i18n-opt="s3_maturity_opt3"></option>
                            <option value="variable" data-i18n-opt="s3_maturity_opt4"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="maturity_criteria" data-i18n="s3_maturity_criteria"></label>
                        <textarea id="maturity_criteria" name="maturity_criteria" data-i18n-placeholder="s3_maturity_criteria_ph"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="rejection_rate" data-i18n="s3_rejection_rate"></label>
                        <input type="number" id="rejection_rate" name="rejection_rate" min="0" max="100" step="0.1">
                    </div>

                    <div class="form-group">
                        <label data-i18n="s3_confidence"></label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" name="raw_material_confidence" value="low"> <span data-i18n="s3_conf_low"></span></label>
                            <label class="radio-item"><input type="radio" name="raw_material_confidence" value="medium"> <span data-i18n="s3_conf_med"></span></label>
                            <label class="radio-item"><input type="radio" name="raw_material_confidence" value="high"> <span data-i18n="s3_conf_high"></span></label>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn btn--secondary" data-prev="2" data-i18n="s3_prev"></button>
                        <button type="button" class="btn btn--primary" data-next="4" data-i18n="s3_next"></button>
                    </div>
                </section>

                <section class="form-section section-hidden" data-section="4">
                    <div class="section-header">
                        <span class="section-number">04</span>
                        <h2 class="section-title" data-i18n="s4_title"></h2>
                    </div>
                    <p class="section-help" data-i18n="s4_help"></p>

                    <div class="form-group">
                        <label data-i18n="s4_indicators"></label>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="color"> Color</label>
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="moisture"> Moisture</label>
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="texture"> Texture</label>
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="taste"> Taste</label>
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="brix"> Brix (sugar content)</label>
                            <label class="checkbox-item"><input type="checkbox" name="quality_indicators" value="appearance"> Appearance</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="quality_indicators_other" data-i18n="s4_indicators_other"></label>
                        <input type="text" id="quality_indicators_other" name="quality_indicators_other">
                    </div>

                    <div class="form-group">
                        <label for="grade_classification" data-i18n="s4_grade"></label>
                        <textarea id="grade_classification" name="grade_classification" data-i18n-placeholder="s4_grade_ph"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="acceptance_threshold" data-i18n="s4_threshold"></label>
                        <textarea id="acceptance_threshold" name="acceptance_threshold" data-i18n-placeholder="s4_threshold_ph"></textarea>
                    </div>

                    <div class="form-group">
                        <label data-i18n="s4_confidence"></label>
                        <div class="radio-group">
                            <label class="radio-item"><input type="radio" name="quality_confidence" value="low"> <span data-i18n="s4_conf_low"></span></label>
                            <label class="radio-item"><input type="radio" name="quality_confidence" value="medium"> <span data-i18n="s4_conf_med"></span></label>
                            <label class="radio-item"><input type="radio" name="quality_confidence" value="high"> <span data-i18n="s4_conf_high"></span></label>
                        </div>

        let currentLang = localStorage.getItem('expert_validation_lang') || 'en';

        function $(selector) {
            return document.querySelector(selector);
        }

        function $$(selector) {
            return document.querySelectorAll(selector);
        }

        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;

            $$('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    el.innerHTML = t[key];
                }
            });

            $$('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) {
                    el.placeholder = t[key];
                }
            });

            $$('[data-i18n-opt]').forEach(el => {
                const key = el.getAttribute('data-i18n-opt');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            const progressBar = $('#progressBar');
            if (progressBar) {
                const pct = Math.round(((currentSection - 1) / (totalSections - 1)) * 100);
                progressBar.textContent = t.progress
                    .replace('{n}', currentSection)
                    .replace('{t}', totalSections)
                    .replace('{p}', pct);
            }

            $$('.lang-btn').forEach(btn => {
                btn.classList.toggle('lang-btn--active', btn.dataset.lang === lang);
            });
        }

        function toggleLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('expert_validation_lang', lang);
            applyTranslations(lang);
            saveToLocalStorage();
        }

        function getFormData() {
            const form = $('#expertForm');
            const formData = new FormData(form);
            const data = {};

            form.querySelectorAll('input, textarea, select').forEach(field => {
                if (field.type === 'checkbox') {
                    if (!data[field.name]) data[field.name] = [];
                    if (field.checked) data[field.name].push(field.value);
                } else if (field.type === 'radio') {
                    if (field.checked) data[field.name] = field.value;
                } else {
                    data[field.name] = field.value;
                }
            });

            return data;
        }

        function saveToLocalStorage() {
            const data = getFormData();
            data._currentSection = currentSection;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const data = JSON.parse(saved);

                Object.keys(data).forEach(key => {
                    if (key === '_currentSection') return;

                    const fields = $$(`[name="${key}"]`);
                    fields.forEach(field => {
                        if (field.type === 'checkbox') {
                            field.checked = data[key].includes(field.value);
                        } else if (field.type === 'radio') {
                            field.checked = field.value === data[key];
                        } else {
                            field.value = data[key];
                        }
                    });
                });

                if (data._currentSection) {
                    showSection(data._currentSection);
                }
            } catch (e) {
                console.warn('Failed to load saved data:', e);
            }
        }

        function showSection(sectionNumber) {
            currentSection = sectionNumber;

            $$('.form-section').forEach(section => {
                section.classList.add('section-hidden');
            });

            $(`.form-section[data-section="${sectionNumber}"]`).classList.remove('section-hidden');

            updateNavigation();
            saveToLocalStorage();
        }

        function updateNavigation() {
            const navLinks = $$('.nav-link');
            navLinks.forEach(link => {
                const section = parseInt(link.dataset.section);
                link.classList.remove('nav-link--active', 'nav-link--completed');

                const icon = $(`#nav-icon-${section}`);

                if (section === currentSection) {
                    link.classList.add('nav-link--active');
                    icon.textContent = section;
                    icon.className = 'nav-icon nav-icon--filled';
                } else if (section < currentSection) {
                    link.classList.add('nav-link--completed');
                    icon.innerHTML = '&#10003;';
                    icon.className = 'nav-icon nav-icon--completed';
                } else {
                    icon.textContent = section;
                    icon.className = 'nav-icon';
                }

                link.style.pointerEvents = section <= currentSection ? 'auto' : 'none';
                link.style.opacity = section <= currentSection ? '1' : '0.5';
            });

            const progressPercent = Math.round(((currentSection - 1) / (totalSections - 1)) * 100);
            applyTranslations(currentLang);
        }

        function generateJSON() {
            const data = getFormData();

            generatedJSON = {
                metadata: {
                    project: "BIT × Infineon Excellence Program",
                    project_area: "Sustainable Farm — Product Transformation",
                    interview_type: "Expert Validation",
                    interview_date: new Date().toISOString(),
                    form_version: "2.0"
                },
                expert: {
                    name: data.expert_name || null,
                    profession: data.profession || null,
                    experience_years: data.experience_years ? parseInt(data.experience_years) : null,
                    specialization: data.specialization || null,
                    activity: data.activity || null
                },
                process: {
                    steps: data.process_steps || null,
                    intervention_stage: data.intervention_stage || null,
                    critical_steps: data.critical_steps || null,
                    confidence: data.process_confidence || null
                },
                raw_material: {
                    varieties: data.varieties || [],
                    varieties_other: data.varieties_other || null,
                    maturity_level: data.maturity_level || null,
                    maturity_criteria: data.maturity_criteria || null,
                    rejection_rate_percent: data.rejection_rate ? parseFloat(data.rejection_rate) : null,
                    confidence: data.raw_material_confidence || null
                },
                quality: {
                    indicators: data.quality_indicators || [],
                    indicators_other: data.quality_indicators_other || null,
                    grade_classification: data.grade_classification || null,
                    acceptance_threshold: data.acceptance_threshold || null,
                    confidence: data.quality_confidence || null
                },
                losses: {
                    total_loss_percent: data.loss_percentage ? parseFloat(data.loss_percentage) : null,
                    main_stage: data.loss_stage || null,
                    main_cause: data.loss_cause || null,
                    confidence: data.losses_confidence || null
                },
                drying: {
                    temperature_celsius: data.temperature_celsius ? parseInt(data.temperature_celsius) : null,
                    duration_hours: data.duration_hours ? parseFloat(data.duration_hours) : null,
                    target_moisture_percent: data.target_moisture ? parseFloat(data.target_moisture) : null,
                    batch_quantity_kg: data.batch_quantity ? parseFloat(data.batch_quantity) : null,
                    energy_source: data.energy_source || null,
                    controlled_parameters: data.drying_parameters || null,
                    confidence: data.drying_confidence || null
                },
                traceability: {
                    batch_data_fields: data.batch_data || [],
                    traceable_events: data.traceable_events || null,
                    confidence: data.traceability_confidence || null
                },
                kpis: {
                    important_kpis: data.kpis || [],
                    missing_kpis: data.missing_kpis || null,
                    confidence: data.kpis_confidence || null
                },
                digitalization: {
                    current_data: data.current_data || null,
                    missing_data: data.missing_data || null,
                    digital_opportunities: data.digital_opportunities || null,
                    confidence: data.digitalization_confidence || null
                },
                recommendations: {
                    main_recommendation: data.main_recommendation || null,
                    avoid_mistake: data.avoid_mistake || null,
                    additional_comments: data.additional_comments || null
                },
                expert_assessment: {
                    solution_relevance: data.assessment_relevance ? parseInt(data.assessment_relevance) : null,
                    most_important_improvement: data.most_important_improvement || null,
                    follow_up_available: data.follow_up || null
                }
            };

            return generatedJSON;
        }

        function downloadJSON() {
            if (!generatedJSON) {
                generateJSON();
            }

            const blob = new Blob([JSON.stringify(generatedJSON, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            const date = new Date().toISOString().split('T')[0];
            link.download = `mango-expert-validation-${date}.json`;
            link.href = url;
            link.click();

            URL.revokeObjectURL(url);
        }

        function exportPDF() {
            const originalTitle = document.title;
            const date = new Date().toISOString().split('T')[0];
            document.title = `mango-expert-validation-${date}-${currentLang}`;

            $$('.form-section').forEach(section => {
                section.classList.remove('section-hidden');
            });

            window.print();

            document.title = originalTitle;
            updateNavigation();
        }

        function saveResponse() {
            generateJSON();
            localStorage.setItem(STORAGE_KEY + '_json', JSON.stringify(generatedJSON));
            $('#confirmationPanel').classList.remove('section-hidden');
        }

        function resetForm() {
            if (!confirm('Clear all responses? This cannot be undone.')) return;

            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY + '_json');
            $('#expertForm').reset();
            showSection(1);
            $('#confirmationPanel').classList.add('section-hidden');
            generatedJSON = null;
        }

        function init() {
            loadFromLocalStorage();

            $$('#langToggle .lang-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleLanguage(btn.dataset.lang));
            });
            applyTranslations(currentLang);

            $$('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const section = parseInt(link.dataset.section);
                    if (section <= currentSection) {
                        showSection(section);
                    }
                });
            });

            $$('[data-next]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const next = parseInt(btn.dataset.next);
                    showSection(next);
                });
            });

            $$('[data-prev]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const prev = parseInt(btn.dataset.prev);
                    showSection(prev);
                });
            });

            $('#expertForm').querySelectorAll('input, textarea, select').forEach(field => {
                field.addEventListener('change', saveToLocalStorage);
                field.addEventListener('input', saveToLocalStorage);
            });

            $('#saveBtn').addEventListener('click', saveResponse);
            $('#exportBtn').addEventListener('click', downloadJSON);
            $('#exportPdfBtn').addEventListener('click', exportPDF);
            $('#resetBtn').addEventListener('click', resetForm);

            $$('textarea').forEach(ta => {
                ta.addEventListener('input', function() {
                    const existing = this.parentElement.querySelector('.char-counter');
                    if (!existing) {
                        const counter = document.createElement('span');
                        counter.className = 'char-counter';
                        this.parentElement.appendChild(counter);
                    }
                    const counter = this.parentElement.querySelector('.char-counter');
                    counter.textContent = `${this.value.length} chars`;
                    counter.className = 'char-counter' + (this.value.length > 900 ? ' char-counter--warning' : '');
                });
            });

            updateNavigation();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
