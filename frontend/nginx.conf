# Site Security sign-in codes: limits per client IP, on top of the limits the
# backend applies per operator account.
#
# The key is $binary_remote_addr: the address of the TCP connection that reached
# nginx. X-Forwarded-For and X-Real-IP sent by the client are never used for it
# (no real_ip module settings), so they cannot be forged to dodge the limit. If a
# trusted TLS proxy is ever put in front of nginx, set set_real_ip_from to that
# proxy only, never to a whole network.
#
# Trade-off: everyone behind the same address (an office NAT, or every browser on
# a Docker Desktop host, which all arrive from the Docker gateway) shares the
# budget. The values leave room for a few operators signing in at once.
limit_req_zone $binary_remote_addr zone=sitesecurity_code_request:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sitesecurity_code_verify:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spring ignores ";params" in any path segment (/api/v1;x/sitesecurity/auth/verify
    # still reaches the endpoint): "[^/]*" after each segment keeps those variants
    # inside the limited locations instead of the general /api/ one, and with no "$"
    # anchor a trailing slash or suffix stays matched too. nginx has already merged "//", resolved
    # "./" and decoded %XX before matching.
    # Asking for a code: 5 a minute per IP, bursts of 5.
    location ~ ^/api[^/]*/v1[^/]*/sitesecurity[^/]*/auth[^/]*/request-code {
        limit_req zone=sitesecurity_code_request burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Checking a code: 10 a minute per IP, bursts of 10 (two codes' worth of tries).
    location ~ ^/api[^/]*/v1[^/]*/sitesecurity[^/]*/auth[^/]*/verify {
        limit_req zone=sitesecurity_code_verify burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
