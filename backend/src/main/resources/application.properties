spring.application.name=sustainable-farm

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watersupply}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Disponibilité des capteurs IoT (placeholder en attendant l'intégration)
app.sensor.availability-percentage=${SENSOR_AVAILABILITY_PERCENTAGE:100}

# Sécurité JWT
app.jwt.secret=${JWT_SECRET:ZnVmZmljaWVudExvbmdTZWN1cmVTZWNyZXRLZXlGb3JIUzI1NlNpZ25hdHVyZU9mVG9rZW5zMDEyMzQ1Njc4OTAxMjM0NTY3}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Flyway - migrations de base de donnees versionnees
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
