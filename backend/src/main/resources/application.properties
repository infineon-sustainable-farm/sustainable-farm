spring.application.name=sustainable-farm

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watersupply}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est gere par Flyway (db/migration). Hibernate ne fait que le verifier :
# toute divergence entre les entites et les migrations fait echouer le demarrage.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Disponibilité des capteurs IoT (placeholder en attendant l'intégration)
app.sensor.availability-percentage=${SENSOR_AVAILABILITY_PERCENTAGE:100}

# Coordonnees utilisees pour les donnees agro-meteo (ET0 et pluie prevue) qui pilotent
# l'estimation du besoin hydrique et les suggestions de report d'irrigation.
app.weather.latitude=${WEATHER_LATITUDE:10.5}
app.weather.longitude=${WEATHER_LONGITUDE:-61.2}

# Authentification : hors du périmètre du module watersupply.
# Elle sera prise en charge par le logiciel global qui couvrira tous les modules.

# Flyway - migrations de base de donnees versionnees.
# Necessite le starter spring-boot-starter-flyway : depuis Spring Boot 4, le fait d'avoir
# flyway-core au classpath ne suffit plus a declencher l'auto-configuration.
# baseline-version=0 + baseline-on-migrate=true permet d'adopter Flyway sur une base deja
# existante : toutes les migrations sont rejouees (elles sont idempotentes).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

