spring.application.name=sustainable-farm

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watersupply}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est gere par Flyway (db/migration). Hibernate ne fait que le verifier :
# toute divergence entre les entites et les migrations fait echouer le demarrage.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Coordonnees du site (Banfora, Burkina Faso) pour les donnees agro-meteo (ET0 et pluie
# prevue) qui pilotent l'estimation du besoin hydrique, le calcul de l'economie d'eau et
# les suggestions de report d'irrigation. Source unique de verite : WeatherController et
# AgroWeatherService les lisent ici. Ajuster via WEATHER_LATITUDE / WEATHER_LONGITUDE si le
# site change.
app.weather.latitude=${WEATHER_LATITUDE:10.63}
app.weather.longitude=${WEATHER_LONGITUDE:-4.77}

# Pilotage automatique de l'irrigation par l'humidite du sol (voir IrrigationAutoTriggerJob) :
# la tache s'execute toutes les 15 minutes et peut etre desactivee sans redeploiement.
app.irrigation.auto-trigger-enabled=${IRRIGATION_AUTO_TRIGGER_ENABLED:true}
app.irrigation.auto-trigger-interval-ms=${IRRIGATION_AUTO_TRIGGER_INTERVAL_MS:900000}
app.irrigation.auto-trigger-initial-delay-ms=${IRRIGATION_AUTO_TRIGGER_INITIAL_DELAY_MS:60000}

# Besoin en eau non-irrigation du site (lavage, transformation) sur une semaine, en litres.
# Tant qu'il vaut 0, la recommandation « utiliser l'eau de pluie en priorite » reste silencieuse
# (voir RainwaterTankMonitor) : le besoin n'est pas connu du systeme.
app.rainwater.weekly-nonirrigation-need-liters=${RAINWATER_WEEKLY_NONIRRIGATION_NEED_LITERS:0}

# Water Supply inter-module integrations (WaterIntegrationProperties). Working defaults, NOT
# validated references: each one is an open question in docs/integrations/.
app.water.quality.ph-min=${WATER_QUALITY_PH_MIN:6.0}
app.water.quality.ph-max=${WATER_QUALITY_PH_MAX:7.5}
app.water.quality.turbidity-max-ntu=${WATER_QUALITY_TURBIDITY_MAX_NTU:5.0}
app.water.rain.default-catchment-area-m2=${WATER_RAIN_DEFAULT_CATCHMENT_AREA_M2:180.0}
app.water.rain.default-runoff-coefficient=${WATER_RAIN_DEFAULT_RUNOFF_COEFFICIENT:0.8}
app.water.visitor.live-window-minutes=${WATER_VISITOR_LIVE_WINDOW_MINUTES:15}
app.water.visitor.safety-default-max-capacity=${WATER_VISITOR_SAFETY_DEFAULT_MAX_CAPACITY:10}
app.water.irrigation.recent-rain-skip-threshold-mm=${WATER_IRRIGATION_RECENT_RAIN_SKIP_THRESHOLD_MM:5.0}
app.water.irrigation.recent-rain-window-hours=${WATER_IRRIGATION_RECENT_RAIN_WINDOW_HOURS:24}
app.water.pt.washing-liters-per-kg=${WATER_PT_WASHING_LITERS_PER_KG:2.0}
app.water.pt.cutting-liters-per-kg=${WATER_PT_CUTTING_LITERS_PER_KG:0.5}
app.water.pt.dryer-cleaning-m3-per-lot=${WATER_PT_DRYER_CLEANING_M3_PER_LOT:1.0}
app.water.pt.buffer-min-liters=${WATER_PT_BUFFER_MIN_LITERS:500.0}
app.water.iot.valve-max-duration-seconds=${WATER_IOT_VALVE_MAX_DURATION_SECONDS:30}
app.water.iot.offline-threshold-minutes=${WATER_IOT_OFFLINE_THRESHOLD_MINUTES:15}
# Multipliers of the FAO-56 need per Plants growth phase; 1.0 = no adjustment until agronomy validates.
app.water.plants.phase-factor.establishment=${WATER_PLANTS_PHASE_FACTOR_ESTABLISHMENT:1.0}
app.water.plants.phase-factor.gradual-production=${WATER_PLANTS_PHASE_FACTOR_GRADUAL_PRODUCTION:1.0}
app.water.plants.phase-factor.full-production=${WATER_PLANTS_PHASE_FACTOR_FULL_PRODUCTION:1.0}

# Authentification : hors du périmètre du module watersupply.
# Elle sera prise en charge par le logiciel global qui couvrira tous les modules.

# Flyway - migrations de base de donnees versionnees.
# Necessite le starter spring-boot-starter-flyway : depuis Spring Boot 4, le fait d'avoir
# flyway-core au classpath ne suffit plus a declencher l'auto-configuration.
# baseline-version=0 + baseline-on-migrate=true permet d'adopter Flyway sur une base deja
# existante : toutes les migrations sont rejouees (elles sont idempotentes).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

