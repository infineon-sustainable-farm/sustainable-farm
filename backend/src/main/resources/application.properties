spring.application.name=sustainable-farm

server.port=${SERVER_PORT:8080}

# DB credentials must be provided via environment variables (no defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Temporary, until the module integration phase: Hibernate creates the tables that no
# migration creates yet. At the end of integration a single baseline migration will be
# generated from the consolidated model and this goes back to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Product Transformation perf fix (B2): HikariCP pool sizing.
# Default 10 connections caused `/kpis` p95 to jump from ~330 ms (1 user) to ~5 s (100 users):
# threads starved against a 10-way pool. Pool 25 + 2 s connection-timeout fails fast instead
# of stacking threads against a full pool.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:2000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:1000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Site coordinates (Banfora, Burkina Faso), shared by every module that needs the farm location.
app.weather.latitude=${WEATHER_LATITUDE:10.63}
app.weather.longitude=${WEATHER_LONGITUDE:-4.77}

# Flyway - versioned database migrations.
# Requires spring-boot-starter-flyway: since Spring Boot 4, flyway-core on the classpath no
# longer triggers the auto-configuration.
# baseline-version=0 + baseline-on-migrate=true adopt Flyway on an existing database: every
# migration is replayed (they are idempotent).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
