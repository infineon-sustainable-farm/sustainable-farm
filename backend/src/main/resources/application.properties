spring.application.name=sustainable-farm

server.port=${SERVER_PORT:8080}

# DB credentials must be provided via environment variables (no defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema comes from the Flyway migrations (db/migration); Hibernate only checks that the
# entities match it and fails the startup on any difference (docs/adr/0002).
spring.jpa.hibernate.ddl-auto=validate
# Readable names for the foreign keys, unique keys and indexes an entity does not name itself,
# the same names as in the migrations (core.schema.ReadableConstraintNamingStrategy).
spring.jpa.hibernate.naming.implicit-strategy=com.infineonbit.sustainablefarm.core.schema.ReadableConstraintNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:2000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:1000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Site coordinates (Banfora, Burkina Faso), shared by every module that needs the farm location.
app.weather.latitude=${WEATHER_LATITUDE:10.63}
app.weather.longitude=${WEATHER_LONGITUDE:-4.77}

# Flyway - versioned database migrations (requires spring-boot-starter-flyway since Spring Boot 4).
# V1__baseline.sql creates the whole schema from the integrated model on an EMPTY database: there
# is no baseline-on-migrate, a database built before the baseline is dropped and recreated
# (docs/adr/0002). Every later change to an entity comes with a new migration V2, V3...
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
