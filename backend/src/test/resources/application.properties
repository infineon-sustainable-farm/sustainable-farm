spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sustainable_farm}
spring.datasource.username=${DB_USERNAME:farm_admin}
spring.datasource.password=${DB_PASSWORD:changeme}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Flyway is off in tests. The migrations in db/migration are PostgreSQL SQL
# (ON CONFLICT, NOW(), bigint literals) and H2 rejects them, so letting Flyway
# run against the test datasource aborts the context before Hibernate can build
# the schema. The schema is created from the entities instead, below.
spring.flyway.enabled=false
