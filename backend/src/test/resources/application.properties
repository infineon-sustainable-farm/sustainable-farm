spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sustainable_farm}
spring.datasource.username=${DB_USERNAME:farm_admin}
spring.datasource.password=${DB_PASSWORD:changeme}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Flyway is off in tests: db/migration is PostgreSQL SQL that H2 rejects, and the
# tests build the schema from the entities (ddl-auto=create, application-test.properties).
# BaselineMigrationIT applies the migration on PostgreSQL and validates the entities against it.
spring.flyway.enabled=false
# Same constraint names as the application and the migrations (see src/main/resources/application.properties).
spring.jpa.hibernate.naming.implicit-strategy=com.infineonbit.sustainablefarm.core.schema.ReadableConstraintNamingStrategy
# Hibernate builds the test schema, without the foreign keys between two modules: the
# installer adds them (the application only verifies them, see CrossModuleForeignKeyInstaller).
app.schema.foreign-keys=install
