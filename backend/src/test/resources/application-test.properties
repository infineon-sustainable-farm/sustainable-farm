spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# No explicit spring.jpa.database-platform: Hibernate auto-detects the dialect
# from the JDBC URL. This file defaults local runs to H2, while the CI sets
# SPRING_DATASOURCE_URL to PostgreSQL and gets PostgreSQLDialect for free.
# Pinning the dialect here (or in CI env) poisons whichever context runs on
# the other database: an H2Dialect on PostgreSQL generates H2-only DDL
# (type "enum" does not exist), a PostgreSQLDialect on H2 emits CHECK
# constraints that H2 rejects ("Check constraint invalid").
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# See ../application.properties: the PostgreSQL migrations cannot run on H2.
spring.flyway.enabled=false
