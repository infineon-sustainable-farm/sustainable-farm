version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sustainable-farm-db
    environment:
      POSTGRES_DB: sustainable_farm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - sustainable-farm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sustainable-farm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sustainable_farm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sustainable-farm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sustainable-farm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sustainable-farm-network

volumes:
  postgres_data:

networks:
  sustainable-farm-network:
    driver: bridge